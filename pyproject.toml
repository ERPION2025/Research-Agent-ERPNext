[project]
name = "research_agent"
authors = [
    { name = "ERPion Technologies LLP", email = "pranav@erpion.in" },
]
description = "Reflexion research and analytics agent for ERPNext. Answers business questions from your own ERP data plus live web research, and returns charts, tables and dashboards."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "tavily-python>=0.7.12",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Retrieval evaluation only. Heavy, and not needed to run the app.
evals = [
    "ragas>=0.2.0",
    "datasets>=2.19.0",
]
analysis = [
    "pandas>=2.0.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
# Frappe indents with tabs. Matching the framework matters more than
# matching PEP 8 here, because these files sit next to frappe and erpnext.
indent-style = "tab"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "E101",   # tabs, see above
    "W191",   # tabs, see above
    "E501",   # long lines: tool descriptions are prose and read better unwrapped
    "B017",
    "B023",
    "B904",
    "RUF001",
    "RUF012",
]
